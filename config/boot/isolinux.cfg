UI menu.c32
PROMPT 0
TIMEOUT 50

MENU TITLE CyberSunil OS 1.0 (Genesis) Boot Menu
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9033ffff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL live
    MENU LABEL ^Start CyberSunil OS 1.0 (Live & Installer)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components quiet splash hostname=cybersunil username=cybersunil

LABEL live-failsafe
    MENU LABEL Start CyberSunil OS (^Safe Graphics / Nomodeset)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components nomodeset quiet splash hostname=cybersunil username=cybersunil

LABEL memtest
    MENU LABEL Run ^Memory Test
    KERNEL /live/memtest
