set default="0"
set timeout=5

insmod font
if loadfont /boot/grub/font.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm_background
    insmod png
    terminal_output gfxterm
fi

set color_normal=light-gray/black
set color_highlight=cyan/black

menuentry "Start CyberSunil OS 1.0 (Live & Installer)" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components quiet splash findiso=${iso_path} hostname=cybersunil username=cybersunil
    initrd /live/initrd.img
}

menuentry "Start CyberSunil OS (Safe Graphics Mode - Nomodeset)" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components nomodeset quiet splash hostname=cybersunil username=cybersunil
    initrd /live/initrd.img
}

menuentry "Install CyberSunil OS directly to Disk" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components calamares quiet splash hostname=cybersunil username=cybersunil
    initrd /live/initrd.img
}

menuentry "Memory Test (memtest86+)" {
    linux16 /live/memtest
}
