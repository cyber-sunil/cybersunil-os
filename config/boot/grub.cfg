set default="0"
set timeout=5

insmod font
if loadfont /boot/grub/font.pf2 ; then
    insmod gfxterm
    set gfxmode=auto
    insmod efi_gop
    insmod efi_uga
    insmod gfxterm_background
    insmod png
    terminal_output gfxterm
fi

set color_normal=green/black
set color_highlight=black/cyan

menuentry ">> INITIATE CYBERSUNIL OS 1.0 (Live Hacker Edition & Installer)" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components quiet splash plymouth.ignore-serial-consoles findiso=${iso_path} hostname=cybersunil username=cybersunil
    initrd /live/initrd.img
}

menuentry ">> INITIATE CYBERSUNIL OS (Safe Diagnostic Graphics - Nomodeset)" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components nomodeset quiet splash hostname=cybersunil username=cybersunil
    initrd /live/initrd.img
}

menuentry ">> INSTALL CYBERSUNIL OS PERMANENTLY (Calamares Engine)" {
    set gfxpayload=keep
    linux /live/vmlinuz boot=live components calamares quiet splash hostname=cybersunil username=cybersunil
    initrd /live/initrd.img
}

menuentry "Memory Test (memtest86+)" {
    linux16 /live/memtest
}
