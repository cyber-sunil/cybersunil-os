<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Lines -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="320" y1="0" x2="320" y2="1080"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
    <line x1="1600" y1="0" x2="1600" y2="1080"/>
  </g>

  <!-- Central Hex Shield Graphic -->
  <g transform="translate(960, 480)" filter="url(#neonGlow)">
    <!-- Outer Hexagon -->
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" 
             fill="none" stroke="url(#cyanAccent)" stroke-width="3" opacity="0.8"/>
    <!-- Inner Hexagon -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" 
             fill="#0b1329" stroke="#7928ca" stroke-width="2" opacity="0.6"/>
    <!-- Cyber Emblem Shape -->
    <path d="M-40,-30 L0,-55 L40,-30 L40,15 L0,40 L-40,15 Z" fill="url(#cyanAccent)" opacity="0.85"/>
    <circle cx="0" cy="-5" r="14" fill="#0a0d14"/>
  </g>

  <!-- OS Name & Subtitle -->
  <text x="960" y="680" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" 
        font-size="48" font-weight="800" fill="#ffffff" letter-spacing="6">
    CYBER<tspan fill="#00f2fe">SUNIL</tspan> OS
  </text>
  
  <text x="960" y="725" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" 
        font-size="18" font-weight="300" fill="#94a3b8" letter-spacing="8">
    POWERED BY LINUX &amp; WINDOWS BRIDGE
  </text>

  <!-- Version pill badge -->
  <rect x="910" y="760" width="100" height="26" rx="13" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
  <text x="960" y="778" text-anchor="middle" font-family="monospace" font-size="12" fill="#00f2fe" font-weight="bold">
    v1.0 LTS
  </text>
</svg>
